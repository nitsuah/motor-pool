name: Visual docs

# Vigil visual-docs recipe (https://github.com/nitsuah/vigil/blob/main/docs/VISUAL_DOCS.md).
# Regenerates screenshots and diagrams, rewrites the README's
# <!-- visual-docs:start --> ... <!-- visual-docs:end --> block, and opens a PR on
# bot/visual-docs. Never pushes to the default branch.
#
# Needs in the repo:
#   scripts/visual-docs-readme.mjs      copy from nitsuah/vigil (zero dependencies)
#   docs/diagrams/*.mmd                 optional; rendered to .svg
#   docs/diagrams/mermaid.config.json   optional; theme/font for the render
#   playwright.visual-docs.config.ts    optional; specs that write docs/screenshots/*.png
# One-time setting: Settings -> Actions -> General -> "Allow GitHub Actions to
# create and approve pull requests".

on:
  push:
    branches: [master]
    # Skip pushes that only carry this workflow's own output (its merged bot PR)
    # or docs, so a merge doesn't trigger another run.
    paths-ignore:
      - 'docs/screenshots/**'
      - 'docs/diagrams/**/*.svg'
      - 'docs/diagrams/**/*.png'
      - '**/*.md'
  workflow_dispatch:

permissions: {}

concurrency:
  group: visual-docs
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bot/visual-docs branch
      pull-requests: write # open or update the regeneration PR
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; fi

      - name: Capture screenshots
        if: hashFiles('playwright.visual-docs.config.ts') != ''
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.visual-docs.config.ts
        env:
          CI: true

      - name: Render diagrams
        if: hashFiles('docs/diagrams/*.mmd') != ''
        run: |
          # ubuntu-latest ships Google Chrome; point mermaid-cli's Puppeteer at it.
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$CHROME" ]; then
            printf '{"executablePath":"%s","args":["--no-sandbox"]}' "$CHROME" > "$RUNNER_TEMP/puppeteer.json"
            PUPPETEER="-p $RUNNER_TEMP/puppeteer.json"
          fi
          CONFIG=""; [ -f docs/diagrams/mermaid.config.json ] && CONFIG="-c docs/diagrams/mermaid.config.json"
          for f in docs/diagrams/*.mmd; do
            npx -y @mermaid-js/mermaid-cli@12.0.0 $PUPPETEER $CONFIG -b white -i "$f" -o "${f%.mmd}.svg"
            echo >> "${f%.mmd}.svg"  # end-of-file-fixer in pre-commit wants a trailing newline
          done

      - name: Update README block
        # Diagrams only: the README's existing Screenshots section already covers
        # docs/screenshots, so point the screenshot scan at a folder that doesn't exist.
        run: SCREENSHOTS_DIR=docs/.no-screenshots node scripts/visual-docs-readme.mjs

      - name: Open or update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/visual-docs
          delete-branch: true
          add-paths: |
            docs/diagrams/*.svg
            README.md
          commit-message: 'docs: regenerate diagrams and screenshots'
          title: 'docs: regenerate diagrams and screenshots'
          body: Regenerated by the visual-docs workflow after ${{ github.sha }}. Review the images, then merge.
