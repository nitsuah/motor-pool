name: Risk guard

# Bootstrap check is loaded from the PR branch and is not trusted against workflow edits.
# Once merged, pull_request_target loads this trusted base-branch version.
# Branch protection should require "Trusted guard / Risk guard", not the bootstrap check.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  bootstrap:
    name: Bootstrap (untrusted)
    if: github.event_name == 'pull_request'
    uses: nitsuah/.github/.github/workflows/risk-guard.yml@c34db982a42a41ee0c05579183186145dc6d1dd7 # main
    permissions:
      contents: read
      pull-requests: read

  guard:
    name: Trusted guard
    if: github.event_name == 'pull_request_target'
    uses: nitsuah/.github/.github/workflows/risk-guard.yml@c34db982a42a41ee0c05579183186145dc6d1dd7 # main
    permissions:
      contents: read
      pull-requests: read
