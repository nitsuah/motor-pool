# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [ main, master, feedback-dev-*, feat/* ]
  pull_request:
    branches: [ main, master, feat/* ]

# Least-privilege default: no step here needs anything beyond reading the
# checked-out repo (checkout, pre-commit, docker compose build/up/test).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Test hardware profile detector
        run: pwsh -NoProfile -File test/detect-profile.Tests.ps1
      - name: Run pre-commit
        run: pre-commit run --all-files --config config/.pre-commit-config.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Lint and root unit tests
        # Root package: eslint.config.mjs covers dashboard/, scripts/ and tests/;
        # vitest.config.mjs runs test/. Dashboard suites run in Docker below.
        run: npm ci && npm run lint && npm test
      - name: Create .env for compose
        # config/docker-compose.yml's env_file entries resolve as ../.env relative to
        # the compose file (config/), i.e. repo-root .env — not config/.env.
        run: touch .env
      - name: Create coverage output dir
        # The `test` service bind-mounts ./dashboard/coverage into the container so the
        # lcov report survives after --rm. Pre-create it so the mount lands with the
        # runner user's ownership rather than being auto-created as root by the Docker
        # daemon, which would leave a later step unable to clean it up.
        run: mkdir -p dashboard/coverage
      - name: Run unit tests with coverage
        # test:coverage runs test:unit under c8 and writes coverage/lcov.info (see
        # dashboard/package.json) — same fail-fast-on-test-failure behavior as plain
        # test:unit, plus the lcov report the next step uploads.
        run: docker compose -f config/docker-compose.yml --profile test run --build --rm test npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: dashboard/coverage/lcov.info
          if-no-files-found: error
      - name: Docker Compose Build
        run: docker compose -f config/docker-compose.yml build agent-dashboard
      - name: Docker Compose Up
        run: docker compose -f config/docker-compose.yml up -d agent-dashboard
      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            if docker compose -f config/docker-compose.yml ps agent-dashboard | grep -q healthy; then
              echo "agent-dashboard is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "agent-dashboard did not become healthy in time"
          docker compose -f config/docker-compose.yml logs agent-dashboard
          exit 1
      - name: Check Docker Compose Services
        run: docker compose -f config/docker-compose.yml ps
