# GPU overlay for Ollama — apply on top of the base docker-compose.yml when
# NVIDIA GPU passthrough is available (requires NVIDIA Container Toolkit on the
# host and the NVIDIA runtime registered with Docker). This overlay is NVIDIA-only.
#
# Detector contract: `verified` means nvidia-smi succeeded and Docker lists the
# `nvidia` runtime; `unverified` means NVIDIA host hardware exists but access could
# not be verified; `none` means no NVIDIA host GPU was detected. Only `verified`
# access lets NVIDIA VRAM count toward an accelerated profile; otherwise use CPU-only
# `minimal`. AMD Radeon RX 470 is CPU-only in the current Docker Desktop setup unless
# a supported alternative is proven. No AMD/Vulkan overlay is provided here.
#
# Usage:
#   docker compose \
#     -f config/docker-compose.yml \
#     -f config/docker-compose.gpu.yml \
#     up -d
#
# Prerequisites (one-time host setup):
#   1. Install NVIDIA drivers for your GPU (RTX 3070 / 4080 / etc.)
#   2. Install NVIDIA Container Toolkit:
#        https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#        On Windows with Docker Desktop: enable "Use the WSL 2 based engine" and
#        install nvidia-container-toolkit inside your WSL2 distro, OR use Docker
#        Desktop's built-in GPU support (Settings → Resources → GPU).
#   3. Verify: docker run --rm --gpus all nvidia/cuda:12.1.0-base-ubuntu22.04 nvidia-smi
#
# What this adds to the `ollama` service:
#   - NVIDIA_VISIBLE_DEVICES=all  — passes all GPUs into the container
#   - NVIDIA_DRIVER_CAPABILITIES  — enables compute + utility capabilities
#   - deploy.resources.reservations.devices — Docker Compose GPU stanza (Compose v3.8+)
#
# The `ollama` service automatically uses GPU inference when CUDA is available inside
# the container. No OLLAMA_GPU env var needed — Ollama detects CUDA at runtime.

services:
  ollama:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
