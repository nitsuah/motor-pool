# motor-pool - Docker Stack

services:
  # ===== PERSISTENCE =====

  agent-db:
    image: postgres:16-alpine
    container_name: agent-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=agent_board
      - POSTGRES_USER=agent
      - POSTGRES_PASSWORD=agent
    ports:
      - "5432:5432"
    volumes:
      - agent_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_board"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-network

  # ===== LLM SERVICES =====

  # Local Ollama instance — runs models pulled via `docker exec ollama ollama pull <model>`
  # Default model: llama3.1:8b-instruct-q4_K_M (4.9 GB; set PRIMARY_LLM_MODEL to a smaller model such as
  # llama3.2:3b on hosts with less RAM).
  # Port: 8081 (host) → 8080 (container)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - OLLAMA_HOST=0.0.0.0:8080
      # Default keep_alive (5m) unloads the model between requests; on CPU-only
      # hosts reloading a 7B model from disk can exceed the dashboard's chat
      # timeout. Keep it resident for 30m of inactivity instead.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      # Ollama's default context is 4096 tokens on hosts with less than 24 GiB VRAM (including CPU-only); a coding agent's prompt (system prompt + tool definitions + brief) is 5k+, so the
      # model silently loses the tools and answers with meta-chatter (confirmed: 'truncating input prompt limit=2050'). 16k costs ~1.5 GiB of KV cache.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-16384}
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - agent-network

  # Auto-pulls PRIMARY_LLM_MODEL into the ollama volume on every `up`, so
  # the model is available without manual intervention. Exits 0 when done.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama:8080
      - PRIMARY_LLM_MODEL=${PRIMARY_LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
    entrypoint: ["sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          ollama list >/dev/null 2>&1 && break
          echo "waiting for ollama... ($$i/30)"
          sleep 3
        done
        echo "pulling $$PRIMARY_LLM_MODEL"
        ollama pull "$$PRIMARY_LLM_MODEL"
        # Load it into memory now: a cold load can take minutes on WSL2/Docker
        # Desktop disk I/O, which would otherwise exceed the dashboard's 120s
        # timeout on the first chat message after `up`.
        echo "warming $$PRIMARY_LLM_MODEL"
        ollama run "$$PRIMARY_LLM_MODEL" "" >/dev/null 2>&1 || true
    restart: "no"
    networks:
      - agent-network

  # Opt-in: pre-loads PRIMARY_LLM_MODEL into the running `ollama` service right
  # after the stack starts, so the ~15-25s cold model load (see
  # docs/MODEL_LOADING_AUDIT.md) happens during `docker compose up` instead of on
  # a user's first chat message. Purely additive — does not modify or restart the
  # `ollama` service. Enable with:
  #   docker compose --profile warmup up ollama-warmup
  ollama-warmup:
    image: ollama/ollama:latest
    container_name: ollama-warmup
    profiles:
      - warmup
    depends_on:
      ollama:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama:8080
      - PRIMARY_LLM_MODEL=${PRIMARY_LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
    entrypoint: ["sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          ollama list >/dev/null 2>&1 && break
          sleep 2
        done
        ollama run "$$PRIMARY_LLM_MODEL" "" || true
    restart: "no"
    networks:
      - agent-network

  # Docker Model Runner (docker.io/ai/* models) — NOT a container.
  # This is Docker Desktop's built-in model runner feature.
  # Pull models on the host with:  docker model pull ai/glm-4.7-flash:latest
  #                                 docker model pull ai/qwen3-coder:latest
  # Endpoint (from inside containers): http://model-runner.docker.internal/engines/llama.cpp/v1
  # API style: OpenAI-compatible (/v1/chat/completions, /v1/models)
  # No container needed — Docker Desktop exposes this automatically.

  # OpenLLM (BentoML) — second OpenAI-compatible endpoint, for custom or
  # fine-tuned HuggingFace models that don't fit Ollama's Modelfile pattern.
  # Opt-in: set OPENLLM_MODEL and enable the `openllm` profile.
  # Enable with: OPENLLM_ENABLED=true OPENLLM_MODEL=<hf-repo-id> docker compose --profile openllm up -d llm_openllm
  # Port: 8082 (host) → 3000 (container)
  llm_openllm:
    build:
      context: ../tools/llm-openllm
      dockerfile: Dockerfile
    container_name: llm_openllm
    restart: unless-stopped
    profiles:
      - openllm
    ports:
      - "8082:3000"
    environment:
      - OPENLLM_MODEL=${OPENLLM_MODEL:-}
      - PORT=3000
    volumes:
      - openllm_data:/root/.cache
    networks:
      - agent-network

  # ===== SAFETY & SANDBOX =====
  # Opt-in: enable with --profile sandbox
  # NemoClaw — sandbox profile (opt-in with --profile sandbox)
  nemoclaw:
    image: nemoclaw:latest
    container_name: nemoclaw
    profiles:
      - sandbox
      - prebuild
    ports:
      - "9000:8080"
    command:
      - -c
      - |
        # 1. Strip Windows CRLF line endings from all shell scripts
        sed -i 's/\r//' /usr/local/lib/nemoclaw/sandbox-init.sh \
          /usr/local/bin/nemoclaw-start /usr/local/bin/docker-entrypoint.sh 2>/dev/null || true

        # 2. Fix gateway.log chown: after capsh drops cap_dac_override, root can't write
        #    to a gateway:gateway-owned file. Remove the chown so it stays root-owned.
        sed -i '/^chown gateway:gateway \/tmp\/gateway\.log$/d' /usr/local/bin/nemoclaw-start

        # 3. Make the persistent log-mirror failure non-fatal.
        #    After normalize_mutable_config_perms resets /sandbox/.openclaw to mode 2770,
        #    root (no cap_dac_override, not in sandbox group) cannot create files inside
        #    that directory. The persistent log-mirror exits 1, which kills the container.
        #    The gateway still logs to /tmp/gateway.log (tailed to stderr), so losing
        #    the persistent /sandbox/.openclaw/logs/gateway-persistent.log is acceptable.
        sed -i 's/start_persistent_gateway_log_mirror || exit 1/start_persistent_gateway_log_mirror || true/g' \
          /usr/local/bin/nemoclaw-start

        # 4. Patch nemoclaw-start to inject chmod o+x (dir) + chmod o+r (file) after BOTH:
        #    a) normalize_mutable_config_perms — resets dir to 2770 (strips other-x), and
        #    b) write_openclaw_config_baseline — creates fresh openclaw.json as root:root
        #       mode 600 (overwriting o+r we set after normalize).
        #    Gateway (uid 999, "other", not in sandbox group) needs o+x on dir and o+r on
        #    file to read its config. We inject via node with full root caps so the chmod
        #    runs in the re-execed nemoclaw-start after each permission-resetting function.
        node -e "
          var fs=require('fs');
          var src=fs.readFileSync('/usr/local/bin/nemoclaw-start','utf8');
          var hits={norm:0,write:0};
          var fix=function(m,pre){
            return m +
              '\n' + pre + 'chmod o+x /sandbox/.openclaw 2>/dev/null || true' +
              '\n' + pre + 'chmod o+r /sandbox/.openclaw/openclaw.json 2>/dev/null || true';
          };
          var patched=src
            .replace(/^(\s*)normalize_mutable_config_perms(\s*)$$/mg,function(m,pre){hits.norm++;return fix(m,pre);})
            .replace(/^(\s*)write_openclaw_config_baseline(\s*)$$/mg,function(m,pre){hits.write++;return fix(m,pre);});
          if(!hits.norm&&!hits.write){
            process.stderr.write('[setup] WARNING: permission-reset functions not found in nemoclaw-start\n');
          } else {
            fs.writeFileSync('/usr/local/bin/nemoclaw-start',patched);
            process.stderr.write('[setup] nemoclaw-start patched: o+x dir + o+r config after normalize(x'+hits.norm+') write_baseline(x'+hits.write+')\n');
          }
        " 2>&1 || echo '[setup] WARNING: nemoclaw-start permission patch failed'

        # Also set o+x/o+r now so recover_openclaw_config_if_empty (which runs before
        # normalize) can stat/read the file as root (treated as "other" without cap_dac_override).
        chmod o+x /sandbox/.openclaw 2>/dev/null || true
        chmod o+r /sandbox/.openclaw/openclaw.json 2>/dev/null || true
        # Fix logs dir ownership so gateway (uid 999) can write config-health.json
        mkdir -p /sandbox/.openclaw/logs 2>/dev/null || true
        chown -R 999:999 /sandbox/.openclaw/logs 2>/dev/null || true

        # 5. Backup / restore openclaw.json using the nemoclaw_data volume (/workspace).
        #    The gateway process can truncate openclaw.json to 0 bytes on a crash.
        #    We save a known-good copy to the persistent volume and restore it on the
        #    next start if the active file is empty.
        #    NOTE: Use $$ prefix on shell vars to prevent docker-compose interpolation.
        _CFG=/sandbox/.openclaw/openclaw.json
        _BAK=/workspace/.nemoclaw-setup/openclaw.json.bak
        mkdir -p /workspace/.nemoclaw-setup 2>/dev/null || true
        if node -e "JSON.parse(require('fs').readFileSync('$$_CFG','utf8'))" 2>/dev/null; then
          cp "$$_CFG" "$$_BAK" 2>/dev/null || true
        else
          if [ -f "$$_BAK" ]; then
            echo "[setup] openclaw.json empty/invalid — restoring from volume backup" >&2
            cp "$$_BAK" "$$_CFG"
            chmod 664 "$$_CFG" 2>/dev/null || true
          else
            echo "[setup] WARNING: openclaw.json is empty and no backup exists." >&2
            echo "[setup] Run: docker compose rm -f nemoclaw  then  docker compose --profile sandbox up -d nemoclaw" >&2
          fi
        fi

        # 6. Patch openclaw.json to use local Ollama (inference.local = NVIDIA cloud).
        node -e "
          var fs=require('fs'), f='$$_CFG';
          var raw=fs.readFileSync(f,'utf8').trim();
          if(!raw){process.stderr.write('[setup] WARNING: config still empty, skipping patch\n');process.exit(0);}
          var c=JSON.parse(raw);
          var inf=c.models&&c.models.providers&&c.models.providers.inference;
          if(inf){inf.baseUrl='http://ollama:8080/v1';inf.apiKey='ollama';}
          var m=process.env.PRIMARY_LLM_MODEL||'llama3.1:8b-instruct-q4_K_M';
          if(c.agents&&c.agents.defaults&&c.agents.defaults.model) c.agents.defaults.model.primary=m;
          if(inf&&inf.models) inf.models=[{id:m,name:m,reasoning:false,input:['text'],
            cost:{input:0,output:0,cacheRead:0,cacheWrite:0},contextWindow:32768,maxTokens:4096}];
          if(!c.gateway) c.gateway={};
          if(!c.gateway.controlUi) c.gateway.controlUi={};
          var ao=c.gateway.controlUi.allowedOrigins;
          if(!Array.isArray(ao)) c.gateway.controlUi.allowedOrigins=['http://localhost:3000'];
          else if(!ao.includes('http://localhost:3000')) ao.push('http://localhost:3000');
          fs.writeFileSync(f,JSON.stringify(c,null,2));
          process.stderr.write('[setup] openclaw.json patched: inference → Ollama '+m+' + allowedOrigins\n');
        " 2>&1 || echo '[setup] WARNING: openclaw.json patch failed'

        # 7. Save patched config as the new backup baseline
        node -e "JSON.parse(require('fs').readFileSync('$$_CFG','utf8'))" 2>/dev/null && \
          cp "$$_CFG" "$$_BAK" 2>/dev/null || true

        # 8. Re-assert gateway ownership after the patch write
        chown 999 "$$_CFG" 2>/dev/null || true

        exec /usr/local/bin/nemoclaw-start
    volumes:
      - nemoclaw_data:/workspace
    environment:
      - NEMOCLAW_HOME=/workspace
      - NEMOCLAW_DASHBOARD_PORT=8080
      - PRIMARY_LLM_MODEL=${PRIMARY_LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
      - CHAT_UI_URL=http://agent-dashboard:3000
    security_opt:
      - no-new-privileges:false
    # healthcheck disabled because wget/curl is unavailable in this container
    depends_on:
      ollama:
        condition: service_started
    networks:
      - agent-network

  # ===== MCP SERVERS =====

  bb-mcp:
    build:
      context: ../bb-mcp
      dockerfile: Dockerfile
    container_name: bb-mcp
    restart: unless-stopped
    profiles:
      - bb-mcp
    ports:
      - "3100:3100"
    env_file:
      - ../bb-mcp/.env
    environment:
      - PORT=3100
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/health',(r)=>{r.resume();r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - agent-network

  # ===== WEB DASHBOARD =====

  agent-dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: agent-dashboard
    restart: unless-stopped
    ports:
      # Loopback only by default; drop the 127.0.0.1: prefix to publish on the LAN
      - "127.0.0.1:3000:3000"
    env_file:
      - ../.env
    environment:
      - PRIMARY_LLM_URL=http://ollama:8080
      - PRIMARY_LLM_MODEL=${PRIMARY_LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
      # Docker Model Runner: Docker Desktop exposes this host to all containers
      - DOCKER_RUNNER_URL=http://model-runner.docker.internal/engines/llama.cpp/v1
      - DOCKER_RUNNER_MODEL=ai/qwen3-coder:latest
      - GLM_FLASH_MODEL=ai/glm-4.7-flash:latest
      - OPENLLM_URL=http://llm_openllm:3000
      - OPENLLM_MODEL=${OPENLLM_MODEL:-}
      - OPENLLM_ENABLED=${OPENLLM_ENABLED:-false}
      - NEMOCLAW_URL=http://nemoclaw:8080
      - BB_MCP_URL=http://bb-mcp:3100
      - BB_MCP_ENABLED=${BB_MCP_ENABLED:-false}
      # MCP tool servers backing the Content Studio / Website Agent experiences
      # (profile `tools` — see tool-content-gen / tool-website below)
      - TOOL_CONTENT_GEN_URL=http://tool-content-gen:3200
      - TOOL_WEBSITE_URL=http://tool-website:3201
      - TOKEN_ECONOMIZER_URL=http://tool-tokeneconomizer:3202
      - AGENT_BOARD_ENABLE_DOCKER_CONTROL=${AGENT_BOARD_ENABLE_DOCKER_CONTROL:-false}
      - PORT=3000
      - DATABASE_URL=postgresql://agent:agent@agent-db:5432/agent_board
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_ENDPOINT=${OTEL_ENDPOINT:-http://jaeger:4318}
      - WORKSPACE_ROOT=/workspace
      # Agents get their own checkout (volume agent_workspace, seeded by the
      # workspace-seed service on branch agent/sandbox), so tool calls never
      # edit the host repo — and the repo itself is not mounted here at all, so
      # model-run shell commands can't read it (or its .env). To point agents at
      # a real project instead, use config/docker-compose.workspace.yml
      # (sets WORKSPACE_SANDBOX=false).
      - WORKSPACE_SANDBOX=true
      - ENDPOINT_STORE_SECRET=${ENDPOINT_STORE_SECRET:-motor-pool-default-secret-change-me}
    volumes:
      - agent_workspace:/workspace
      - agent_endpoint_data:/data
      # Active session snapshots (including messages) survive container recreation.
      - agent_session_data:/app/data
    # Docker socket access is intentionally not mounted by default.
    # Add it only in a trusted dev override/profile when Docker control is explicitly needed.
    # Healthcheck is inherited from dashboard/Dockerfile.
    # depends_on:

    #   llm_qwen3:
    #     condition: service_healthy
    #   llm_qwen_coder:
    #     condition: service_healthy
    #   llm_glm_flash:
    #     condition: service_healthy
    depends_on:
      agent-db:
        condition: service_healthy
      workspace-seed:
        condition: service_completed_successfully
    networks:
      - agent-network

  # One-shot: seeds the agent sandbox volume from a read-only mount of the repo
  # (git clone + current working tree, never .env files), then exits. It is the
  # only service that sees the source tree; an existing sandbox is left as-is.
  # Reset the sandbox with: docker volume rm <project>_agent_workspace
  workspace-seed:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    command: ["node", "scripts/seed-workspace.mjs"]
    environment:
      - WORKSPACE_ROOT=/workspace
      - WORKSPACE_SANDBOX_SOURCE=/source
    volumes:
      - ../:/source:ro
      - agent_workspace:/workspace
    network_mode: none
    restart: "no"

  # ===== OBSERVABILITY =====

  # Jaeger all-in-one — accepts OTLP and provides a trace UI.
  # View traces at http://localhost:16686
  # OTLP/HTTP endpoint (used by agent-dashboard): http://jaeger:4318
  # Opt-in: enable with --profile observability  (also set OTEL_ENABLED=true)
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: jaeger
    restart: unless-stopped
    profiles:
      - observability
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP/HTTP ingest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-network

  # ===== TOOL: CONTENT-GEN (profile: tools) =====
  # AI video generation MCP server wrapping MoneyPrinterTurbo.
  # MoneyPrinterTurbo itself runs on the HOST (not in this stack) because
  # it manages its own Docker containers. This service just wraps its API.
  # Enable with:  docker compose --profile tools up tool-content-gen
  tool-content-gen:
    build:
      # Relative to this compose file's directory (config/) — run compose commands
      # WITHOUT --project-directory so build contexts, volumes, and env_file paths
      # all resolve consistently from here.
      context: ../tools/content-gen
      dockerfile: Dockerfile
    container_name: tool-content-gen
    restart: unless-stopped
    profiles:
      - tools
      - prebuild
    ports:
      - "3200:3200"
    # No env_file here deliberately: this container proxies to
    # MoneyPrinterTurbo and handles untrusted video-generation prompts, so it
    # gets only the specific variables it actually needs below rather than
    # every secret in the root .env (GITHUB_SECRET, POSTGRES_PASSWORD,
    # NETLIFY_AUTH_TOKEN, etc. — CWE-200, a compromised tool container had no
    # reason to be able to read those).
    environment:
      - CONTENT_GEN_PORT=3200
      - MPT_API_URL=${MPT_API_URL:-http://host.docker.internal:8080}
      - MPT_UI_URL=${MPT_UI_URL:-http://host.docker.internal:8501}
    # No repo-root mount either: this service only wraps MoneyPrinterTurbo's
    # HTTP API (which runs separately on the host — see the header comment
    # above), and never reads from tools/content-gen's own codebase at
    # /workspace-root; the mount would otherwise expose the root .env to a
    # container handling untrusted video-generation prompts (CWE-200).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3200/health',(r)=>{r.resume();r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - agent-network

  # ===== TOOL: WEBSITE (profile: tools) =====
  # B2B website generation MCP server. Runs website gen scripts on the host
  # via PowerShell (mounted from workspace-root).
  # Enable with:  docker compose --profile tools up tool-website
  tool-website:
    build:
      # Relative to this compose file's directory (config/) — run compose commands
      # WITHOUT --project-directory so build contexts, volumes, and env_file paths
      # all resolve consistently from here.
      context: ../tools/website
      dockerfile: Dockerfile
    container_name: tool-website
    restart: unless-stopped
    profiles:
      - tools
      - prebuild
    ports:
      - "3201:3201"
    # No env_file here deliberately: this container handles untrusted
    # website-generation and lead-discovery input, so it gets only the
    # specific variables it needs below (including NETLIFY_AUTH_TOKEN, which
    # this container's own deploy scripts use) rather than every secret in
    # the root .env — GITHUB_SECRET, POSTGRES_PASSWORD, etc. — that a
    # compromised tool container had no reason to read (CWE-200).
    environment:
      - WEBSITE_PORT=3201
      - WEBSITE_OUTPUT_DIR=/output
      - YELP_API_KEY=${YELP_API_KEY:-}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
      - YOUR_NAME=${YOUR_NAME:-}
      - YOUR_COMPANY=${YOUR_COMPANY:-Your Web Agency}
      - YOUR_EMAIL=${YOUR_EMAIL:-}
      - YOUR_PHONE=${YOUR_PHONE:-}
      # Netlify auth token — avoids interactive `netlify login` inside the container.
      # Get yours at: https://app.netlify.com/user/applications#personal-access-tokens
      - NETLIFY_AUTH_TOKEN=${NETLIFY_AUTH_TOKEN:-}
    volumes:
      # /app/output matches $PSScriptRoot/../output inside the container scripts
      - website_output:/app/output
      # Relative to this compose file's directory (config/) — run compose commands
      # WITHOUT --project-directory so build contexts, volumes, and env_file paths
      # all resolve consistently from here.
      - ../tools/website/templates:/app/templates:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3201/health',(r)=>{r.resume();r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - agent-network

  # ===== TOOL: TOKENECONOMIZER (profile: tools) =====
  # Microsoft TokenEconomizer HTTP wrapper. Reduces coding agent costs by learning
  # from past sessions (micro-skills), pruning unused tools, detecting stuck loops.
  # See https://github.com/microsoft/TokenEconomizer
  # Enable with: docker compose --profile tools up tool-tokeneconomizer
  # Requires local TokenEconomizer install: git clone https://github.com/microsoft/TokenEconomizer
  # Then set TE_PYTHON to python3 path and mount ~/.tokeneconomizer volume.
  tool-tokeneconomizer:
    build:
      context: ../tools/tokeneconomizer
      dockerfile: Dockerfile
    container_name: tool-tokeneconomizer
    restart: unless-stopped
    profiles:
      - tools
      - prebuild
    ports:
      - "3202:3202"
    # TokenEconomizer runs model calls through your existing agent on same plan/login.
    # No API keys needed. Data stays in ~/.tokeneconomizer volume.
    environment:
      - TOKEN_ECONOMIZER_PORT=3202
      - TE_PYTHON=${TE_PYTHON:-python3}
      - TOKEN_ECONOMIZER_DATA_DIR=${TOKEN_ECONOMIZER_DATA_DIR:-/home/nodeapp/.tokeneconomizer}
    volumes:
      # TokenEconomizer learned data (microskills, toolprune state, configs)
      - tokeneconomizer_data:/home/nodeapp/.tokeneconomizer
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3202/health',(r)=>{r.resume();r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - agent-network

  # ===== TEST (unit — no stack required) =====
  test:
    build:
      context: ../dashboard
      target: test
    profiles:
      - test
    environment:
      AGENT_DASHBOARD_DISABLE_LISTEN: "1"
      DATABASE_URL: ""
      ENDPOINT_STORE_PATH: /tmp/endpoint-store.json
      SESSION_SNAPSHOT_PATH: /tmp/session-snapshot.json
    # Bind-mount the lcov report dir so `npm run test:coverage` output
    # (coverage/lcov.info, written by c8) survives after `--rm` removes the
    # container — CI needs it on the host filesystem to upload as an artifact.
    volumes:
      - ../dashboard/coverage:/app/coverage

volumes:
  agent_db_data:
  ollama_data:  # Local Ollama model storage (llama2, etc.)
  openllm_data:  # OpenLLM/HuggingFace + BentoML model cache
  nemoclaw_data:
  website_output:  # Persistent storage for generated client sites and pitch materials
  agent_endpoint_data:  # Encrypted custom endpoint store (survives restarts)
  agent_session_data:  # Active-session snapshots including message history
  agent_workspace:  # Agent sandbox checkout — reset with: docker volume rm <project>_agent_workspace
  tokeneconomizer_data:  # TokenEconomizer learned data (microskills, toolprune state, configs)

networks:
  agent-network:
    name: agent-network
    driver: bridge
    external: false
